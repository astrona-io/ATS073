# Course manifest for ATS073. Each section lists its README, the module (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz. A final domain quiz closes the course.
training:
  id: ATS073
  title: 'OTCA: Fundamentals of Observability'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering every published objective in this OTCA domain. Labs run on kind (Kubernetes 1.35) with the OpenTelemetry Collector and Prometheus.
  certification:
    name: OpenTelemetry Certified Associate
    code: OTCA
    provider: CNCF / Linux Foundation
    domain: Fundamentals of Observability
    weight: 18
    competencies:
    - Telemetry Data
    - Semantic Conventions
    - Instrumentation
    - Analysis and Outcomes
modules:
  - id: module-intro
    title: Introduction
    description: Audience, learning approach, tools to install and contribution process.
    content:
    - type: reading
      title: "Introduction"
      path: sections/intro/README.md
    - type: reading
      title: "Welcome To The Course"
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: "Get Your Machine Ready"
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: "How This Course Is Made"
      path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Telemetry Data"
    description: >
      Makes the reader able to say what metrics, traces and logs record, how resource identity and scope tell where telemetry came from, and what the data cannot prove, and to change the pipelines and resource attributes of an OpenTelemetry Collector in a running cluster.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md

      - type: reading
        title: "Telemetry Signals, Resource Identity And Evidence Limits"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Metrics, Traces And Logs: What Each Signal Records"
        path: sections/section-010/module-01/course-01-metrics-traces-and-logs.md
      - type: reading
        title: "Resource Identity, Scope And Correlation"
        path: sections/section-010/module-01/course-02-resource-identity-scope-and-correlation.md
      - type: reading
        title: "Collector Pipelines, Sampling And Evidence Limits"
        path: sections/section-010/module-01/course-03-collector-pipelines-sampling-and-evidence-limits.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Collector Pipelines And Resource Attributes Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, collector, pipelines, resource-processor, debug-exporter]
        learning_goals:
          - "Add metrics and logs pipelines to a Collector that only processes traces"
          - "Set resource attributes with the resource processor in all three pipelines"
          - "Read the debug exporter output of the restarted Collector to confirm the result"
        resources:
          - name: "OpenTelemetry Collector configuration"
            url: https://opentelemetry.io/docs/collector/configuration/
          - name: "OpenTelemetry signals"
            url: https://opentelemetry.io/docs/concepts/signals/
      - type: reading
        title: "Summary"
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Telemetry Data Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, collector, sampling, resource-processor, evidence]
        learning_goals:
          - "Add the missing metrics pipeline and set resource attributes in every pipeline"
          - "Sample traces with the probabilistic sampler without touching metrics or logs"
          - "Record the findings in a ConfigMap"
        resources:
          - name: "Collector processors"
            url: https://opentelemetry.io/docs/collector/configuration/#processors
          - name: "Probabilistic sampler processor"
            url: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/probabilisticsamplerprocessor
      - type: quiz
        title: "Knowledge Check: Telemetry Data"
        path: sections/section-010/quiz.yaml
        pass_score: 70

  - id: module-020
    title: "Semantic Conventions"
    description: >
      Makes the reader able to explain a semantic convention as a shared contract, place each attribute on the resource or on the operation, and rename, copy and remove attributes in a Collector without breaking dashboards or leaking personal data.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-020/README.md

      - type: reading
        title: "Semantic Conventions, Attribute Meaning And Stability"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Semantic Conventions As A Shared Contract"
        path: sections/section-020/module-01/course-01-semantic-conventions-as-a-shared-contract.md
      - type: reading
        title: "Resource Attributes And Operation Attributes"
        path: sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md
      - type: reading
        title: "Normalizing Attributes In The Collector"
        path: sections/section-020/module-01/course-03-normalizing-attributes-in-the-collector.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Normalize Span Attributes Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, semantic-conventions, attributes-processor, collector, privacy]
        learning_goals:
          - "Copy old attribute names to the current convention names and keep the value types"
          - "Remove the old names and a personal attribute with the attributes processor"
          - "Check the result in the debug exporter output"
        resources:
          - name: "OpenTelemetry semantic conventions"
            url: https://opentelemetry.io/docs/specs/semconv/
          - name: "Attributes processor"
            url: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/attributesprocessor
      - type: reading
        title: "Summary"
        path: sections/section-020/module-01/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Semantic Conventions Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, semantic-conventions, cardinality, privacy, resource-processor]
        learning_goals:
          - "Rename old attribute names on spans while keeping the integer status code"
          - "Remove personal and unbounded attributes from spans, logs and metrics"
          - "Record the review in a ConfigMap"
        resources:
          - name: "HTTP semantic conventions"
            url: https://opentelemetry.io/docs/specs/semconv/http/
          - name: "Resource semantic conventions"
            url: https://opentelemetry.io/docs/specs/semconv/resource/
      - type: quiz
        title: "Knowledge Check: Semantic Conventions"
        path: sections/section-020/quiz.yaml
        pass_score: 70

  - id: module-030
    title: "Instrumentation"
    description: >
      Makes the reader able to explain what the API, the SDK and an exporter each do, configure an instrumented program with OTEL environment variables, and choose measurements that are useful, small and safe.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-030/README.md

      - type: reading
        title: "API Calls, Automatic Instrumentation And Measurement Design"
        path: sections/section-030/module-01/course.md
      - type: reading
        title: "API, SDK And Exporter: Who Does What"
        path: sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md
      - type: reading
        title: "Automatic Instrumentation And Environment Variables"
        path: sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md
