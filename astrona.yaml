        path: sections/section-030/module-01/course-03-designing-useful-measurements.md
      - type: reading
        title: "Question"
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "Configure An Instrumented Program Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, python, otel-environment-variables, otlp, service-name]
        learning_goals:
          - "Match the OTLP endpoint to the exporter protocol"
          - "Set the service name and resource attributes with environment variables"
          - "Confirm spans and a counter in the Collector output"
        resources:
          - name: "Python zero-code instrumentation"
            url: https://opentelemetry.io/docs/zero-code/python/
          - name: "SDK environment variables"
            url: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      - type: reading
        title: "Summary"
        path: sections/section-030/module-01/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Instrumentation Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: observability
        task_kind: fix
        tags: [opentelemetry, python, sampler, sdk-disabled, otlp, troubleshooting]
        learning_goals:
          - "Find three different causes of missing telemetry in the environments of three Deployments"
          - "Fix each cause without editing code, images or the Collector"
          - "Record the cause for each program in a ConfigMap"
        resources:
          - name: "OpenTelemetry sampling"
            url: https://opentelemetry.io/docs/concepts/sampling/
          - name: "OTLP exporter configuration"
            url: https://opentelemetry.io/docs/specs/otel/protocol/exporter/
      - type: quiz
        title: "Knowledge Check: Instrumentation"
        path: sections/section-030/quiz.yaml
        pass_score: 70

  - id: module-040
    title: "Analysis and Outcomes"
    description: >
      Makes the reader able to turn telemetry into a decision: define an SLI and an SLO, calculate an error budget and a burn rate, build a latency indicator from a histogram, check scrape health, and read a dashboard without mistaking a missing series for a measured zero.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-040/README.md

      - type: reading
        title: "Service Indicators, Objectives, Agreements And Budgets"
        path: sections/section-040/module-01/course.md
      - type: reading
        title: "SLIs, SLOs And SLAs: Defining Good And Valid Events"
        path: sections/section-040/module-01/course-01-slis-slos-and-slas.md
      - type: reading
        title: "Error Budgets And Burn Rate"
        path: sections/section-040/module-01/course-02-error-budgets-and-burn-rate.md
      - type: reading
        title: "Question"
        path: sections/section-040/module-01/labs/lab-01/question.md
      - type: lab
        title: "Availability SLI And Error Budget Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: observability
        task_kind: build
        tags: [prometheus, promql, sli, slo, error-budget]
        learning_goals:
          - "Query Prometheus for good and valid events with the stated definition"
          - "Calculate the SLI, the allowed bad events and the budget consumed"
          - "Record the report in a ConfigMap"
        resources:
          - name: "Service level objectives"
            url: https://sre.google/sre-book/service-level-objectives/
          - name: "Prometheus querying"
            url: https://prometheus.io/docs/prometheus/latest/querying/basics/
      - type: reading
