        path: sections/section-040/module-01/course-03-latency-indicators-and-scrape-health.md
      - type: reading
        title: "Dashboards That Explain Population, Units And Gaps"
        path: sections/section-040/module-01/course-04-dashboards-population-units-and-gaps.md
      - type: reading
        title: "Summary"
        path: sections/section-040/module-01/course-05-summary.md

      - type: reading
        title: "Question"
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Analysis and Outcomes Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: observability
        task_kind: fix
        tags: [prometheus, promql, histogram, scrape-health, latency-sli]
        learning_goals:
          - "Fix a scrape job that targets the wrong port and confirm up is 1"
          - "Compute a latency SLI from the cumulative buckets of a histogram"
          - "Report a job with no data as no-data and not as zero"
        resources:
