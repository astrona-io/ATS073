# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Align Attributes With Semantic Conventions (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-073-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0

bootstrap:
  init:
    - name: seed-cluster
      description: "Create the Collector and a generator that sends old attribute names"
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the collector and the generators have produced new output
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: collector-available
      description: "The Collector Deployment is available with its original image"
      type: file
      source: validation/validate-collector-available.sh
      hint: "Change the ConfigMap and restart the Deployment. Do not replace it."
    - name: new-names-present
      description: "Spans carry http.request.method=GET and http.response.status_code=200 with the integer type"
      type: file
      source: validation/validate-new-names-present.sh
      hint: "Copy each old attribute to the new key with action upsert and from_attribute. Keep 200 as an integer."
    - name: old-names-absent
      description: "Spans no longer carry http.method or http.status_code"
      type: file
      source: validation/validate-old-names-absent.sh
      hint: "Delete the old keys after copying them. Actions run in the order of the list."
    - name: personal-data-removed
      description: "Spans do not carry user.email"
      type: file
      source: validation/validate-personal-data-removed.sh
      hint: "Delete user.email in the Collector. Restart the Collector so the new pod runs the new configuration."
    - name: identity-kept
      description: "service.name stays scout and the generator is unchanged"
      type: file
      source: validation/validate-identity-kept.sh
      hint: "Do not edit scout-load, and do not overwrite service.name."

teardown:
  keepCluster: false
