apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout-load
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout-load
  template:
    metadata:
      labels:
        app: scout-load
    spec:
      containers:
        - name: traces
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'traces'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '2'
            - '--service'
            - 'scout'
            - '--telemetry-attributes'
            - 'http.method="GET"'
            - '--telemetry-attributes'
            - 'http.status_code=200'
            - '--telemetry-attributes'
            - 'user.email="ensign@example.com"'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle-load
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle-load
  template:
    metadata:
      labels:
        app: shuttle-load
    spec:
      containers:
        - name: logs
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'logs'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '2'
            - '--service'
            - 'shuttle'
            - '--telemetry-attributes'
            - 'user.email="ensign@example.com"'
            - '--telemetry-attributes'
            - 'http.method="POST"'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-load
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-load
  template:
    metadata:
      labels:
        app: probe-load
    spec:
      containers:
        - name: metrics
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'metrics'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '1'
            - '--service'
            - 'probe'
            - '--telemetry-attributes'
            - 'customer.id="c-48213"'
