apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    processors:
      attributes/traces:
        actions:
          - key: http.request.method
            from_attribute: http.method
            action: upsert
          - key: http.method
            action: delete
          - key: http.response.status_code
            from_attribute: http.status_code
            action: upsert
          - key: http.status_code
            action: delete
          - key: user.email
            action: delete
      attributes/logs:
        actions:
          - key: user.email
            action: delete
      attributes/metrics:
        actions:
          - key: customer.id
            action: delete
      resource:
        attributes:
          - key: deployment.environment.name
            value: production
            action: upsert
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [attributes/traces, resource]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [attributes/logs, resource]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [attributes/metrics, resource]
          exporters: [debug]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: semconv-review
  namespace: starfleet
data:
  renamed: "http.method=http.request.method,http.status_code=http.response.status_code"
  removed: "user.email,customer.id"
  resource-attribute: "deployment.environment.name"
