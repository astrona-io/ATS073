# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats073-020"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: "section"
  id: "section-020"
  title: "Semantic Conventions"
questions:
  - id: "ats073-020-q01"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Explain what a semantic convention defines"
    source_readings:
      - "sections/section-020/module-01/course-01-semantic-conventions-as-a-shared-contract.md"
    prompt: "What does a semantic convention define?"
    options:
      - id: "a"
        text: "The retention period of telemetry in a backend."
        explanation: "Retention is a backend policy."
      - id: "b"
        text: "Which users may read the telemetry."
        explanation: "Access control is outside the conventions."
      - id: "c"
        text: "The names, types, units and requirement levels of attributes and signals."
        explanation: "Correct. A convention is a shared contract, so that two producers describe the same fact in the same way."
      - id: "d"
        text: "The sampling rate of a service."
        explanation: "Sampling is configured in the SDK or the Collector."
    correct_option: "c"
    explanation: "A convention is a shared contract, so that two producers describe the same fact in the same way."
  - id: "ats073-020-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Describe deprecation and stability"
    source_readings:
      - "sections/section-020/module-01/course-01-semantic-conventions-as-a-shared-contract.md"
    prompt: "A span uses `http.method`. The current convention uses `http.request.method` for the same fact. How should a team treat the old name?"
    options:
      - id: "a"
        text: "Keep both forever, because names never change."
        explanation: "Conventions do change. Two names for one fact make queries harder."
      - id: "b"
        text: "Treat it as deprecated: move to the new name and remove the old one, ideally in one controlled change."
        explanation: "Correct. A deprecated name is replaced by the current one. A stable name is expected to stay, a deprecated one is expected to leave."
      - id: "c"
        text: "Delete the span, because the attribute is invalid."
        explanation: "The span is valid. Only the attribute name is outdated."
      - id: "d"
        text: "Rename it to `method` for brevity."
        explanation: "A private short name breaks the shared contract."
    correct_option: "b"
    explanation: "A deprecated name is replaced by the current one. A stable name is expected to stay, a deprecated one is expected to leave."
  - id: "ats073-020-q03"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Place attributes on the resource or on the operation"
    source_readings:
      - "sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md"
    prompt: "Which value belongs on the resource and not on a span?"
    options:
      - id: "a"
        text: "`http.response.status_code`."
        explanation: "The status code describes one response, so it is a span attribute."
      - id: "b"
        text: "`http.request.method`."
        explanation: "The method describes one request, so it is a span attribute."
      - id: "c"
        text: "`user.email` of the current user."
        explanation: "A per-user value describes one operation and is also personal data."
      - id: "d"
        text: "`service.name`."
        explanation: "Correct. It identifies the producing service and is the same for all its telemetry."
    correct_option: "d"
    explanation: "It identifies the producing service and is the same for all its telemetry."
  - id: "ats073-020-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Reason about cardinality of metric attributes"
    source_readings:
      - "sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md"
    prompt: "A metric has the attribute `customer.id`, which has a different value for every customer. What is the main problem?"
    options:
      - id: "a"
        text: "Every distinct value creates a new time series, so the number of series grows without a bound."
        explanation: "Correct. Metric series are keyed by the attribute values, so an unbounded attribute causes unbounded storage and slow queries."
      - id: "b"
        text: "The metric type changes from counter to gauge."
        explanation: "The type does not depend on the attributes."
      - id: "c"
        text: "The attribute turns into a resource attribute."
        explanation: "An attribute never changes its kind by itself."
      - id: "d"
        text: "The SDK refuses to record the metric."
        explanation: "The SDK records it. The cost shows up later in the backend."
    correct_option: "a"
    explanation: "Metric series are keyed by the attribute values, so an unbounded attribute causes unbounded storage and slow queries."
  - id: "ats073-020-q05"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Reason about data types of attributes"
    source_readings:
      - "sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md"
    prompt: "A dashboard filters `http.response.status_code >= 500`. After a change, the span attribute holds the string `\"503\"`. What happens?"
    options:
      - id: "a"
        text: "The filter works the same, because the digits are identical."
        explanation: "A numeric comparison does not match a string value."
      - id: "b"
        text: "The comparison no longer matches as a number, so the dashboard misses the failures."
        explanation: "Correct. The type is part of the contract. The status code must stay an integer."
      - id: "c"
        text: "The Collector converts the value on its own."
        explanation: "The Collector changes a type only when a processor is configured to do it."
      - id: "d"
        text: "The span is dropped."
        explanation: "The span is kept with a different type."
    correct_option: "b"
    explanation: "The type is part of the contract. The status code must stay an integer."
  - id: "ats073-020-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose the right action of the attributes processor"
    source_readings:
      - "sections/section-020/module-01/course-03-normalizing-attributes-in-the-collector.md"
    prompt: "Which action of the `attributes` processor sets a value whether or not the attribute exists?"
    options:
      - id: "a"
        text: "`insert`."
        explanation: "`insert` adds the attribute only when it does not exist."
      - id: "b"
        text: "`update`."
        explanation: "`update` changes the attribute only when it already exists."
      - id: "c"
        text: "`upsert`."
        explanation: "Correct. `upsert` inserts the attribute when it is missing and updates it when it exists."
      - id: "d"
        text: "`delete`."
        explanation: "`delete` removes the attribute."
    correct_option: "c"
    explanation: "`upsert` inserts the attribute when it is missing and updates it when it exists."
  - id: "ats073-020-q07"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Explain why the order of actions matters"
    source_readings:
      - "sections/section-020/module-01/course-03-normalizing-attributes-in-the-collector.md"
    prompt: "The goal is to rename `http.method` to `http.request.method`. Which order of actions in the `attributes` processor gives the result?"
    options:
      - id: "a"
        text: "Delete `http.method`, then copy it with `from_attribute`."
        explanation: "After the delete there is nothing left to copy from."
      - id: "b"
        text: "Copy `http.method` into `http.request.method` with `from_attribute`, then delete `http.method`."
        explanation: "Correct. The processor runs the actions in the order listed, so the copy must come before the delete."
      - id: "c"
        text: "Only delete `http.method`; the new name appears on its own."
        explanation: "No attribute is created automatically."
      - id: "d"
        text: "List the two actions in any order, because they run in parallel."
        explanation: "They run one after the other, in the listed order."
    correct_option: "b"
    explanation: "The processor runs the actions in the order listed, so the copy must come before the delete."
  - id: "ats073-020-q08"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Remove a personal value before it leaves the Collector"
    source_readings:
      - "sections/section-020/module-01/course-03-normalizing-attributes-in-the-collector.md"
    prompt: "The security team does not allow the span attribute `user.email` to leave the Collector. Which Collector change does this?"
    options:
      - id: "a"
        text: "A `delete` action on `user.email` in an `attributes` processor of the traces pipeline."
        explanation: "Correct. The attribute is removed before the exporters see the span. Removing the value at the source is still the better long-term control."
      - id: "b"
        text: "A `debug` exporter with `verbosity: basic`."
        explanation: "The exporter verbosity only changes what is printed. It does not change the data other exporters get."
      - id: "c"
        text: "A larger `sampling_percentage`."
        explanation: "Sampling selects traces and does not remove attributes."
      - id: "d"
        text: "A second Collector replica."
        explanation: "More replicas do not change the data."
    correct_option: "a"
    explanation: "The attribute is removed before the exporters see the span. Removing the value at the source is still the better long-term control."
