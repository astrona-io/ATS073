# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Sanitize Database Spans With The Transform Processor (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-073-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0

bootstrap:
  init:
    - name: seed-cluster
      description: "Create the Collector and a generator that sends old database attribute names"
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the collector and the generators have produced new output
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: collector-available
      description: "The Collector Deployment is available with its original image"
      type: file
      source: validation/validate-collector-available.sh
      hint: "Do not delete or replace the Deployment. Change only the ConfigMap, then restart the Deployment."
    - name: transform-used
      description: "The traces pipeline lists the transform processor with a replace_pattern statement"
      type: file
      source: validation/validate-transform-used.sh
      hint: "Define a transform processor with trace_statements for the span context and list it in the traces pipeline in flow style."
    - name: new-names-present
      description: "Spans carry db.system.name, db.namespace and db.query.text"
      type: file
      source: validation/validate-new-names-present.sh
      hint: "Use set to copy each old attribute to its new name before you delete the old one."
    - name: old-names-absent
      description: "Spans no longer carry db.system, db.name or db.statement"
      type: file
      source: validation/validate-old-names-absent.sh
      hint: "Use delete_key on each old name, after the copies."
    - name: query-sanitized
      description: "The query text shows id = ? and never id = 42"
      type: file
      source: validation/validate-query-sanitized.sh
      hint: "Use replace_pattern on db.query.text after the copy, with the pattern = [0-9]+ and the replacement = ?."
    - name: identity-kept
      description: "service.name stays harbor and the generator is unchanged"
      type: file
      source: validation/validate-identity-kept.sh
      hint: "Fix the Collector. Do not edit harbor-db-load."

teardown:
  keepCluster: false
