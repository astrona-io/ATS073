# Final domain quiz. Listed in astrona.yaml as the last `type: quiz` entry of the course.
schema_version: 1
kind: "question_bank"
id: "ats073-domain-review"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material; not official examination questions."
scope:
  type: "domain"
  id: "domain-review"
  title: "Fundamentals of Observability"
questions:
  - id: "ats073-domain-review-q01"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish traces, metrics and logs by the questions they answer."
    source_readings:
      - "sections/section-010/module-01/course-01-metrics-traces-and-logs.md"
    prompt: "Which signal most directly connects operations along a request path?"
    options:
      - id: "a"
        text: "A catalog display title."
        explanation: "It is software metadata rather than telemetry."
      - id: "b"
        text: "A trace assembled from related spans."
        explanation: "Spans describe timed operations and their relationships."
      - id: "c"
        text: "A single aggregate CPU gauge."
        explanation: "It does not identify the request path."
    correct_option: "b"
    explanation: "Spans describe timed operations and their relationships."
  - id: "ats073-domain-review-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Explain resource identity and signal correlation."
    source_readings:
      - "sections/section-010/module-01/course-02-resource-identity-scope-and-correlation.md"
    prompt: "Why attach resource identity to telemetry?"
    options:
      - id: "a"
        text: "To identify the producing service and environment consistently."
        explanation: "It supports meaningful grouping and correlation."
      - id: "b"
        text: "To make every metric a complete request trace."
        explanation: "Signal models remain different."
      - id: "c"
        text: "To authorize all backend actions."
        explanation: "Identity attributes do not grant permission."
    correct_option: "a"
    explanation: "It supports meaningful grouping and correlation."
  - id: "ats073-domain-review-q03"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Identify sampling, cardinality and collection gaps in evidence."
    source_readings:
      - "sections/section-010/module-01/course-03-collector-pipelines-sampling-and-evidence-limits.md"
    prompt: "Why is an absent span insufficient to prove an operation never ran?"
    options:
      - id: "a"
        text: "Every span always reaches every backend."
        explanation: "Delivery is not universally guaranteed."
      - id: "b"
        text: "Logs automatically recreate every discarded span."
        explanation: "Signals do not provide automatic reconstruction."
      - id: "c"
        text: "Sampling or collection loss may hide it."
        explanation: "The observation path has its own limits."
    correct_option: "c"
    explanation: "The observation path has its own limits."
  - id: "ats073-domain-review-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Explain semantic conventions as shared telemetry contracts."
    source_readings:
      - "sections/section-020/module-01/course-01-semantic-conventions-as-a-shared-contract.md"
    prompt: "What problem do semantic conventions address?"
    options:
      - id: "a"
        text: "Automatic permission to disclose customer data."
        explanation: "Conventions do not grant that permission."
      - id: "b"
        text: "Inconsistent names and meanings across telemetry producers."
        explanation: "Shared contracts improve interpretation."
      - id: "c"
        text: "Automatic storage of every request forever."
        explanation: "Retention is a backend policy."
    correct_option: "b"
    explanation: "Shared contracts improve interpretation."
  - id: "ats073-domain-review-q05"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish resource attributes from operation attributes."
    source_readings:
      - "sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md"
    prompt: "Which value most naturally describes a resource?"
    options:
      - id: "a"
        text: "The service identity producing telemetry."
        explanation: "It identifies the producer."
      - id: "b"
        text: "The status of one individual HTTP response."
        explanation: "That describes a particular operation."
      - id: "c"
        text: "The text of one exception message."
        explanation: "That is event data."
    correct_option: "a"
    explanation: "It identifies the producer."
  - id: "ats073-domain-review-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Reason about attribute stability, cardinality and privacy."
    source_readings:
      - "sections/section-020/module-01/course-02-resource-attributes-and-operation-attributes.md"
    prompt: "Why avoid a unique customer identifier as a metric attribute by default?"
    options:
      - id: "a"
        text: "Metric attributes never affect series count."
        explanation: "They define dimensions."
      - id: "b"
        text: "Standard naming automatically anonymizes every value."
        explanation: "Naming does not anonymize data."
      - id: "c"
        text: "It can create unbounded cardinality and disclose sensitive information."
        explanation: "Each distinct combination can expand the data population."
    correct_option: "c"
    explanation: "Each distinct combination can expand the data population."
  - id: "ats073-domain-review-q07"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish manual instrumentation from automatic instrumentation."
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "Which observation commonly needs manual application instrumentation?"
    options:
      - id: "a"
        text: "The Collector's configuration file syntax."
        explanation: "That is collector configuration rather than application instrumentation."
      - id: "b"
        text: "A business-specific decision not represented by a framework hook."
        explanation: "The application owns that meaning."
      - id: "c"
        text: "Every supported HTTP client operation in every case."
        explanation: "A compatible automatic instrumentor may cover it."
    correct_option: "b"
    explanation: "The application owns that meaning."
  - id: "ats073-domain-review-q08"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Explain API, SDK and exporter responsibilities."
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "What primarily implements telemetry recording and export behavior?"
    options:
      - id: "a"
        text: "The configured SDK and its pipeline components."
        explanation: "The API is the interface, while the SDK supplies implementation."
      - id: "b"
        text: "The API package alone regardless of installed implementation."
        explanation: "An API can exist without a recording SDK."
      - id: "c"
        text: "A catalog annotation containing the exporter name."
        explanation: "Metadata does not initialize a pipeline."
    correct_option: "a"
    explanation: "The API is the interface, while the SDK supplies implementation."
  - id: "ats073-domain-review-q09"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Select useful boundaries without duplicate or sensitive telemetry."
    source_readings:
      - "sections/section-030/module-01/course-03-designing-useful-measurements.md"
    prompt: "Why review automatic and manual coverage together?"
    options:
      - id: "a"
        text: "Automatic instrumentation cannot ever create a span."
        explanation: "Creating spans is a normal capability."
      - id: "b"
        text: "Manual instrumentation automatically redacts all values."
        explanation: "Data minimization must be deliberate."
      - id: "c"
        text: "Overlapping instrumentation can duplicate observations."
        explanation: "Coverage needs coherent boundaries."
    correct_option: "c"
    explanation: "Coverage needs coherent boundaries."
  - id: "ats073-domain-review-q10"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish an SLI, SLO and SLA."
    source_readings:
      - "sections/section-040/module-01/course-01-slis-slos-and-slas.md"
    prompt: "What is an SLO?"
    options:
      - id: "a"
        text: "Automatically a legal penalty clause."
        explanation: "An SLA has a separate agreement contract."
      - id: "b"
        text: "A target for a defined service indicator over a specified window."
        explanation: "It turns measurement into an operational objective."
      - id: "c"
        text: "Every raw scrape sample."
        explanation: "Samples are inputs to measurement."
    correct_option: "b"
    explanation: "It turns measurement into an operational objective."
  - id: "ats073-domain-review-q11"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Define good and valid event populations and an evaluation window."
    source_readings:
      - "sections/section-040/module-01/course-01-slis-slos-and-slas.md"
    prompt: "Why define valid events?"
    options:
      - id: "a"
        text: "They establish the denominator of the indicator."
        explanation: "Good outcomes need a coherent reference population."
      - id: "b"
        text: "They make all requests successful automatically."
        explanation: "Definitions do not alter outcomes."
      - id: "c"
        text: "They eliminate all missing data."
        explanation: "Observation coverage remains a limitation."
    correct_option: "a"
    explanation: "Good outcomes need a coherent reference population."
  - id: "ats073-domain-review-q12"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Calculate an error budget and interpret burn rate."
    source_readings:
      - "sections/section-040/module-01/course-02-error-budgets-and-burn-rate.md"
    prompt: "A target allows 0.1% failures and observation shows 1%. What is the conceptual burn rate?"
    options:
      - id: "a"
        text: "Exactly one failed request universally."
        explanation: "The event count depends on the population."
      - id: "b"
        text: "One percent of the scrape interval."
        explanation: "Scrape timing is not that budget calculation."
      - id: "c"
        text: "Ten times the allowed fraction."
        explanation: "One percent divided by one-tenth of a percent is ten."
    correct_option: "c"
    explanation: "One percent divided by one-tenth of a percent is ten."
  - id: "ats073-domain-review-q13"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Place the sampling decision"
    source_readings:
      - "sections/section-010/module-02/course-03-head-sampling-and-tail-sampling.md"
    prompt: "A team must keep every trace that contains an error. Which approach can do this?"
    options:
      - id: "a"
        text: "Tail sampling, because the decision is made after the spans of the trace are collected."
        explanation: "Correct. Only a decision after the outcome is known can keep every error trace."
      - id: "b"
        text: "Head sampling at 10 percent, because it decides at the start of the trace."
        explanation: "At the start, nobody knows if the trace will contain an error."
      - id: "c"
        text: "Head sampling with a higher percentage only."
        explanation: "A higher percentage keeps more traces but still cannot select errors."
      - id: "d"
        text: "Dropping all spans with the status unset in the application."
        explanation: "This changes the data of the application and does not look at whole traces."
    correct_option: "a"
    explanation: "Tail sampling decides after the spans are collected and can keep every trace with an error."
  - id: "ats073-domain-review-q14"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Reason about a set of sampled traces"
    source_readings:
      - "sections/section-010/module-02/course-04-what-a-set-of-traces-can-prove.md"
    prompt: "Sampled traces show 3 slow requests among 40 stored traces. Which statement is justified?"
    options:
      - id: "a"
        text: "7.5 percent of all requests are slow."
        explanation: "Sampling can change the proportion, so a share of stored traces is not a share of requests."
      - id: "b"
        text: "The stored traces show what those individual requests did, but they do not prove a rate or a total."
        explanation: "Correct. A set of sampled traces shows individual requests and not totals."
      - id: "c"
        text: "No request was slow except these 3."
        explanation: "Sampling hides requests, so absence is weak evidence."
      - id: "d"
        text: "The sampler is broken."
        explanation: "Nothing in the data says that."
    correct_option: "b"
    explanation: "A set of sampled traces shows what individual requests did. It does not give totals or rates."
  - id: "ats073-domain-review-q15"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Handle database query text"
    source_readings:
      - "sections/section-020/module-02/course-03-database-and-messaging-conventions.md"
    prompt: "A database span has the query text `SELECT * FROM orders WHERE id = 42`. Which handling follows the convention?"
    options:
      - id: "a"
        text: "Keep the text, because it is the most useful value."
        explanation: "Literal values can hold personal data and give high cardinality."
      - id: "b"
        text: "Replace the literal value with a placeholder before export."
        explanation: "Correct. Sanitized query text keeps the shape and removes the values."
      - id: "c"
        text: "Move the text to the span name."
        explanation: "This makes the name high in cardinality."
      - id: "d"
        text: "Store the text as a resource attribute."
        explanation: "It changes per operation, so it does not belong on the resource."
    correct_option: "b"
    explanation: "A query text with literal values is high cardinality and can hold personal data."
  - id: "ats073-domain-review-q16"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Place Kubernetes attributes on the resource"
    source_readings:
      - "sections/section-020/module-02/course-04-kubernetes-cloud-and-custom-attributes.md"
    prompt: "Where does the attribute `k8s.pod.name` belong?"
    options:
      - id: "a"
        text: "On every span as an operation attribute only."
        explanation: "The pod does not change per operation."
      - id: "b"
        text: "In the span name."
        explanation: "The name describes the operation."
      - id: "c"
        text: "On the resource, because it describes where the program runs."
        explanation: "Correct. Kubernetes and cloud attributes describe the producer and belong on the resource."
      - id: "d"
        text: "In the metric name."
        explanation: "Metric names carry the measured thing and the unit."
    correct_option: "c"
    explanation: "Kubernetes and cloud attributes describe where a program runs and belong on the resource."
  - id: "ats073-domain-review-q17"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Record a caught exception"
    source_readings:
      - "sections/section-030/module-02/course-03-events-exceptions-and-span-status.md"
    prompt: "Code catches a `ValueError` inside the span block and carries on. The exported span has the status unset and no event. What is missing?"
    options:
      - id: "a"
        text: "A second tracer."
        explanation: "A second tracer would not change this."
      - id: "b"
        text: "A longer span name."
        explanation: "The name does not record failure."
      - id: "c"
        text: "A call to `record_exception` and a call to `set_status` with the error status."
        explanation: "Correct. An exception caught inside the block is hidden from the context manager, so the code must record it and set the status."
      - id: "d"
        text: "A resource attribute."
        explanation: "It describes the producer."
    correct_option: "c"
    explanation: "An exception caught inside the block hides from the context manager."
  - id: "ats073-domain-review-q18"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Pick the instrument for a duration"
    source_readings:
      - "sections/section-030/module-02/course-04-metric-instruments-in-code.md"
    prompt: "Which instrument records the time that each order takes, so that the share below a threshold can be read later?"
    options:
      - id: "a"
        text: "Counter."
        explanation: "A counter only adds up and has no distribution."
      - id: "b"
        text: "Histogram."
        explanation: "Correct. A histogram records a distribution, and durations are recorded in seconds."
      - id: "c"
        text: "UpDownCounter."
        explanation: "It follows a value that goes up and down."
      - id: "d"
        text: "Log record."
        explanation: "A log record is not a metric instrument."
    correct_option: "b"
    explanation: "A Histogram records a distribution and durations use seconds."
  - id: "ats073-domain-review-q19"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Map the golden signals"
    source_readings:
      - "sections/section-040/module-02/course-03-the-four-golden-signals-and-choosing-a-method.md"
    prompt: "Which signal of the four golden signals is not covered by RED?"
    options:
      - id: "a"
        text: "Latency."
        explanation: "RED covers it as duration."
      - id: "b"
        text: "Traffic."
        explanation: "RED covers it as rate."
      - id: "c"
        text: "Saturation."
        explanation: "Correct. USE covers saturation. RED has no measurement for it."
      - id: "d"
        text: "Errors."
        explanation: "RED covers errors."
    correct_option: "c"
    explanation: "RED covers latency, traffic and errors, and USE covers saturation."
  - id: "ats073-domain-review-q20"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Load a recording rule"
    source_readings:
      - "sections/section-040/module-02/course-04-promql-for-each-signal-and-recording-rules.md"
    prompt: "A rule file with a correct recording rule is mounted at `/etc/prometheus/rules.yml`, but Prometheus does not produce the new series. What is the most likely cause?"
    options:
      - id: "a"
        text: "The rule name contains a colon."
        explanation: "A colon is the convention for recorded names."
      - id: "b"
        text: "The rule file is not listed under `rule_files` in the configuration, or Prometheus was not restarted or reloaded."
        explanation: "Correct. An unlisted file is ignored without an error, and a running Prometheus reads a changed file only after a restart or a reload."
      - id: "c"
        text: "The rule uses the function `sum`."
        explanation: "This function is allowed in a rule."
      - id: "d"
        text: "The service has too many labels."
        explanation: "This does not stop a rule from being loaded."
    correct_option: "b"
    explanation: "A recording rule file has no effect until rule_files lists it."
