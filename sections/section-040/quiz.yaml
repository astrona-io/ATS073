# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats073-040"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: "section"
  id: "section-040"
  title: "Analysis and Outcomes"
questions:
  - id: "ats073-040-q01"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Distinguish an SLI, an SLO and an SLA"
    source_readings:
      - "sections/section-040/module-01/course-01-slis-slos-and-slas.md"
    prompt: "Which statement about the three terms is correct?"
    options:
      - id: "a"
        text: "An SLO is a contract that names a refund when the target is missed."
        explanation: "That describes an SLA."
      - id: "b"
        text: "An SLI is a measured ratio of good events to valid events, an SLO is the target for it over a window, and an SLA is a contract with a consequence."
        explanation: "Correct. Each term has its own job: measurement, goal and agreement."
      - id: "c"
        text: "An SLA is the raw count of requests."
        explanation: "A count is an input to an SLI."
      - id: "d"
        text: "An SLI is the target value that the team chooses."
        explanation: "That describes an SLO."
    correct_option: "b"
    explanation: "Each term has its own job: measurement, goal and agreement."
  - id: "ats073-040-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Define valid and good events"
    source_readings:
      - "sections/section-040/module-01/course-01-slis-slos-and-slas.md"
    prompt: "For the route `/orders`, the definition excludes `4xx` responses and counts `2xx` and `3xx` as good. The route served 1000 requests: 900 with `200`, 50 with `404` and 50 with `503`. What is the SLI?"
    options:
      - id: "a"
        text: "900 divided by 950, which is 94.74 percent."
        explanation: "Correct. The valid events are 950 (the 50 `404` are excluded) and the good events are 900."
      - id: "b"
        text: "900 divided by 1000, which is 90 percent."
        explanation: "This counts the client errors as valid events, which the definition excludes."
      - id: "c"
        text: "950 divided by 1000, which is 95 percent."
        explanation: "This counts the `404` responses as good events."
      - id: "d"
        text: "50 divided by 950, which is 5.26 percent."
        explanation: "This is the bad event ratio, not the SLI."
    correct_option: "a"
    explanation: "The valid events are 950 (the 50 `404` are excluded) and the good events are 900."
  - id: "ats073-040-q03"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Calculate an error budget"
    source_readings:
      - "sections/section-040/module-01/course-02-error-budgets-and-burn-rate.md"
    prompt: "An SLO of 99.9 percent applies to 2,000,000 valid events in the window. How many bad events does the objective allow?"
    options:
      - id: "a"
        text: "200"
        explanation: "This is 0.01 percent of the events."
      - id: "b"
        text: "20,000"
        explanation: "This is 1 percent of the events."
      - id: "c"
        text: "2,000"
        explanation: "Correct. The allowed bad events equal the valid events multiplied by 0.001."
      - id: "d"
        text: "1,998,000"
        explanation: "This is the number of good events at the limit, not the allowed bad events."
    correct_option: "c"
    explanation: "The allowed bad events equal the valid events multiplied by 0.001."
  - id: "ats073-040-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Calculate a burn rate"
    source_readings:
      - "sections/section-040/module-01/course-02-error-budgets-and-burn-rate.md"
    prompt: "The SLO is 99.9 percent. In the last hour the error ratio was 0.5 percent. What is the burn rate?"
    options:
      - id: "a"
        text: "0.5"
        explanation: "The burn rate is not the error ratio itself."
      - id: "b"
        text: "50"
        explanation: "The burn rate divides by 0.001, but the error ratio 0.005 gives 5, not 50."
      - id: "c"
        text: "0.005"
        explanation: "This is the error ratio as a fraction."
      - id: "d"
        text: "5"
        explanation: "Correct. The burn rate is the error ratio divided by the allowed error ratio: 0.005 divided by 0.001."
    correct_option: "d"
    explanation: "The burn rate is the error ratio divided by the allowed error ratio: 0.005 divided by 0.001."
  - id: "ats073-040-q05"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Identify cases where the budget arithmetic misleads"
    source_readings:
      - "sections/section-040/module-01/course-02-error-budgets-and-burn-rate.md"
    prompt: "A service handles 200 requests in a 30-day window and has an SLO of 99.9 percent. Why is the arithmetic unreliable?"
    options:
      - id: "a"
        text: "One failed request breaches the objective, so the ratio swings widely with a single event."
        explanation: "Correct. Low traffic makes the allowed bad events smaller than one, so a single failure decides the result."
      - id: "b"
        text: "The SLO cannot be set below 99.99 percent."
        explanation: "No such limit exists."
      - id: "c"
        text: "Prometheus cannot store fewer than 1000 samples."
        explanation: "Prometheus stores any number of samples."
      - id: "d"
        text: "Error budgets exist only for latency."
        explanation: "A budget applies to any indicator that has a target."
    correct_option: "a"
    explanation: "Low traffic makes the allowed bad events smaller than one, so a single failure decides the result."
  - id: "ats073-040-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Read cumulative histogram buckets"
    source_readings:
      - "sections/section-040/module-01/course-03-latency-indicators-and-scrape-health.md"
    prompt: "A histogram has `le=\"0.3\"` with 18400, `le=\"0.5\"` with 19500 and `le=\"+Inf\"` with 20000. How many requests took longer than 0.3 seconds but at most 0.5 seconds?"
    options:
      - id: "a"
        text: "19500"
        explanation: "The bucket is cumulative, so it also contains the faster requests."
      - id: "b"
        text: "1100"
        explanation: "Correct. The buckets are cumulative, so subtract: 19500 minus 18400."
      - id: "c"
        text: "37900"
        explanation: "Adding cumulative buckets counts requests more than once."
      - id: "d"
        text: "500"
        explanation: "This is 20000 minus 19500, the requests slower than 0.5 seconds."
    correct_option: "b"
    explanation: "The buckets are cumulative, so subtract: 19500 minus 18400."
  - id: "ats073-040-q07"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose a latency threshold"
    source_readings:
      - "sections/section-040/module-01/course-03-latency-indicators-and-scrape-health.md"
    prompt: "The team wants the objective: 95 percent of requests finish in 250 milliseconds or less. The histogram has the bounds 0.1, 0.3, 0.5 and 1. What follows?"
    options:
      - id: "a"
        text: "Use the bucket 0.3 and call it 250 milliseconds."
        explanation: "That changes the objective without saying so."
      - id: "b"
        text: "Average the buckets 0.1 and 0.3."
        explanation: "Averaging buckets has no meaning."
      - id: "c"
        text: "Divide the count by 250."
        explanation: "The count is a number of requests, not a time."
      - id: "d"
        text: "The threshold must be a bucket bound, so the program needs a bucket at 0.25 before the SLI can be exact."
        explanation: "Correct. A histogram holds no information inside a bucket, and it cannot be repartitioned afterwards."
    correct_option: "d"
    explanation: "A histogram holds no information inside a bucket, and it cannot be repartitioned afterwards."
  - id: "ats073-040-q08"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Read scrape health"
    source_readings:
      - "sections/section-040/module-01/course-03-latency-indicators-and-scrape-health.md"
    prompt: "The series `up{job=\"scout\"}` has the value 0 and a query for `http_request_duration_seconds_count{job=\"scout\"}` returns an empty result. What does this say?"
    options:
      - id: "a"
        text: "The scrape of `scout` fails, so there is a gap in the data and not a measured zero."
        explanation: "Correct. A failed scrape produces no samples. It does not mean that the service had no traffic."
      - id: "b"
        text: "The service `scout` had no requests."
        explanation: "The data cannot say that when the scrape fails."
      - id: "c"
        text: "The histogram has the value zero."
        explanation: "An empty result is not a zero."
      - id: "d"
        text: "Prometheus is out of memory."
        explanation: "Nothing here points to that."
    correct_option: "a"
    explanation: "A failed scrape produces no samples. It does not mean that the service had no traffic."
  - id: "ats073-040-q09"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Combine ratios across groups"
    source_readings:
      - "sections/section-040/module-01/course-04-dashboards-population-units-and-gaps.md"
    prompt: "Route A has 1000 valid events and 10 bad. Route B has 10 valid events and 5 bad. How is the correct overall error ratio computed?"
    options:
      - id: "a"
        text: "Average the two ratios: 1 percent and 50 percent."
        explanation: "This gives 25.5 percent and weights both routes equally. The traffic differs by a factor of 100."
      - id: "b"
        text: "Add the bad events and divide by the added valid events: 15 divided by 1010."
        explanation: "Correct. Add the counts first, then divide."
      - id: "c"
        text: "Take the larger ratio of the two routes."
        explanation: "That reports the worst route, not the overall ratio."
      - id: "d"
        text: "Divide the bad events of route B by the valid events of route A."
        explanation: "The two counts belong to different populations."
    correct_option: "b"
    explanation: "Add the counts first, then divide."
  - id: "ats073-040-q10"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Tell a gap from a zero"
    source_readings:
      - "sections/section-040/module-01/course-04-dashboards-population-units-and-gaps.md"
    prompt: "A panel query ends with `or vector(0)`. The scrape for the series fails. What does the panel show?"
    options:
      - id: "a"
        text: "No data."
        explanation: "The expression replaces an empty result with a sample."
      - id: "b"
        text: "An error message."
        explanation: "The query is valid and returns a sample."
      - id: "c"
        text: "A flat line at zero, which looks like a calm service while the measurement is broken."
        explanation: "Correct. The fill hides the gap. An `up` panel and an `absent` alert keep the gap visible."
      - id: "d"
        text: "The last value before the failure."
        explanation: "Prometheus does not repeat old values this way."
    correct_option: "c"
    explanation: "The fill hides the gap. An `up` panel and an `absent` alert keep the gap visible."
  - id: "ats073-040-q11"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Name the RED measurements"
    source_readings:
      - "sections/section-040/module-02/course-01-the-red-method-for-services.md"
    prompt: "Which three measurements make up the RED method?"
    options:
      - id: "a"
        text: "Rate, errors and duration."
        explanation: "Correct. RED describes a request-driven service with these three."
      - id: "b"
        text: "Utilization, saturation and errors."
        explanation: "That is the USE method."
      - id: "c"
        text: "Reads, edits and deletes."
        explanation: "These are not a standard method."
      - id: "d"
        text: "Requests, entries and data."
        explanation: "These are not the RED measurements."
    correct_option: "a"
    explanation: "RED is rate, errors and duration."
  - id: "ats073-040-q12"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Pick the method for a resource"
    source_readings:
      - "sections/section-040/module-02/course-02-the-use-method-for-resources.md"
    prompt: "A team must check a disk, a network link and a thread pool. Which method fits?"
    options:
      - id: "a"
        text: "RED, because every part receives requests."
        explanation: "Resources do not have a request path to measure."
      - id: "b"
        text: "The error budget only."
        explanation: "A budget needs an objective, not a checklist for resources."
      - id: "c"
        text: "Tail sampling."
        explanation: "It is a trace technique."
      - id: "d"
        text: "USE, because these are resources with a limited capacity."
        explanation: "Correct. USE gives utilization, saturation and errors for each resource."
    correct_option: "d"
    explanation: "RED fits services, USE fits resources."
  - id: "ats073-040-q13"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Tell utilization from saturation"
    source_readings:
      - "sections/section-040/module-02/course-02-the-use-method-for-resources.md"
    prompt: "A worker pool has a utilization of 0.62. What does this value tell about requests that wait for a free worker?"
    options:
      - id: "a"
        text: "Nothing. Saturation needs its own metric, such as a queue length."
        explanation: "Correct. Utilization shows how much capacity is in use, not how much work waits."
      - id: "b"
        text: "No request waits, because the value is below 1."
        explanation: "Bursts can make work wait at a utilization below 1."
      - id: "c"
        text: "Exactly 38 percent of requests wait."
        explanation: "There is no such relation."
      - id: "d"
        text: "All requests wait."
        explanation: "The value does not say this."
    correct_option: "a"
    explanation: "Utilization alone does not show saturation."
  - id: "ats073-040-q14"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Read an empty result"
    source_readings:
      - "sections/section-040/module-02/course-02-the-use-method-for-resources.md"
    prompt: "A query for `bridge_worker_queue_length` returns an empty result. What does it mean?"
    options:
      - id: "a"
        text: "The queue length is 0."
        explanation: "A measured zero returns a value of 0."
      - id: "b"
        text: "No series with that name exists, so the measurement is missing."
        explanation: "Correct. An empty result is not a measured zero."
      - id: "c"
        text: "Prometheus is down."
        explanation: "Prometheus answered, so it is up."
      - id: "d"
        text: "The queue is full."
        explanation: "Nothing in the result says that."
    correct_option: "b"
    explanation: "An empty query result is not a measured zero."
  - id: "ats073-040-q15"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Map the golden signals"
    source_readings:
      - "sections/section-040/module-02/course-03-the-four-golden-signals-and-choosing-a-method.md"
    prompt: "Which signal of the four golden signals is not covered by RED?"
    options:
      - id: "a"
        text: "Latency."
        explanation: "RED covers it as duration."
      - id: "b"
        text: "Traffic."
        explanation: "RED covers it as rate."
      - id: "c"
        text: "Saturation."
        explanation: "Correct. USE covers saturation. RED has no measurement for it."
      - id: "d"
        text: "Errors."
        explanation: "RED covers errors."
    correct_option: "c"
    explanation: "RED covers latency, traffic and errors, and USE covers saturation."
  - id: "ats073-040-q16"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Load a recording rule"
    source_readings:
      - "sections/section-040/module-02/course-04-promql-for-each-signal-and-recording-rules.md"
    prompt: "A rule file with a correct recording rule is mounted at `/etc/prometheus/rules.yml`, but Prometheus does not produce the new series. What is the most likely cause?"
    options:
      - id: "a"
        text: "The rule name contains a colon."
        explanation: "A colon is the convention for recorded names."
      - id: "b"
        text: "The rule file is not listed under `rule_files` in the configuration, or Prometheus was not restarted or reloaded."
        explanation: "Correct. An unlisted file is ignored without an error, and a running Prometheus reads a changed file only after a restart or a reload."
      - id: "c"
        text: "The rule uses the function `sum`."
        explanation: "This function is allowed in a rule."
      - id: "d"
        text: "The service has too many labels."
        explanation: "This does not stop a rule from being loaded."
    correct_option: "b"
    explanation: "A recording rule file has no effect until rule_files lists it."
