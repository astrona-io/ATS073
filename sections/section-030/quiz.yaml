# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats073-030"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: "section"
  id: "section-030"
  title: "Instrumentation"
questions:
  - id: "ats073-030-q01"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Explain why library code depends on the API only"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "A shared library records spans. Why should it depend on the OpenTelemetry API and not on a specific SDK?"
    options:
      - id: "a"
        text: "The API is faster than the SDK."
        explanation: "Speed is not the reason."
      - id: "b"
        text: "The API exports data over the network, and the SDK does not."
        explanation: "The SDK, not the API, exports data."
      - id: "c"
        text: "The application owner chooses the SDK and the exporter, and the library works with any of them."
        explanation: "Correct. The API defines the calls. The application decides what implements them, so a library does not force a choice."
      - id: "d"
        text: "The SDK cannot record spans."
        explanation: "The SDK does record spans."
    correct_option: "c"
    explanation: "The API defines the calls. The application decides what implements them, so a library does not force a choice."
  - id: "ats073-030-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Describe what happens with the API and no SDK"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "A program calls the API to start a span, but no SDK is installed or configured. What happens?"
    options:
      - id: "a"
        text: "The calls do nothing: the API returns no-op objects and no telemetry is recorded."
        explanation: "Correct. Without an SDK, the API calls are no-ops, and that keeps libraries safe to use everywhere."
      - id: "b"
        text: "The program fails at start."
        explanation: "The API is designed so that the program keeps running."
      - id: "c"
        text: "The spans are written to the standard output."
        explanation: "Printing is a job of an exporter in an SDK."
      - id: "d"
        text: "The spans are sent to port 4317 by default."
        explanation: "The API has no exporter and sends nothing."
    correct_option: "a"
    explanation: "Without an SDK, the API calls are no-ops, and that keeps libraries safe to use everywhere."
  - id: "ats073-030-q03"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Name the role of an exporter"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "Which component sends finished spans from the program to the Collector?"
    options:
      - id: "a"
        text: "The tracer provider of the API."
        explanation: "The API only defines the interface."
      - id: "b"
        text: "A span exporter, such as the OTLP exporter, in the SDK pipeline."
        explanation: "Correct. The SDK passes finished spans to a processor and then to an exporter that sends them over a protocol."
      - id: "c"
        text: "The `resource` processor of the Collector."
        explanation: "That component runs in the Collector, after the data has been sent."
      - id: "d"
        text: "The Kubernetes Service."
        explanation: "A Service routes network traffic and does not export telemetry."
    correct_option: "b"
    explanation: "The SDK passes finished spans to a processor and then to an exporter that sends them over a protocol."
  - id: "ats073-030-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Match the exporter protocol with the endpoint port"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A program sets `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf` and `OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317`. The Collector listens on 4317 for gRPC and on 4318 for HTTP. What is wrong?"
    options:
      - id: "a"
        text: "The scheme must be `https`."
        explanation: "The scheme is not the problem."
      - id: "b"
        text: "The protocol must be `grpc` when the port is above 4000."
        explanation: "The protocol does not depend on the port number this way."
      - id: "c"
        text: "Nothing, because both ports accept both protocols."
        explanation: "Each port serves one protocol."
      - id: "d"
        text: "The protocol `http/protobuf` needs the HTTP port 4318, not the gRPC port 4317."
        explanation: "Correct. The endpoint must match the protocol, otherwise the export fails."
    correct_option: "d"
    explanation: "The endpoint must match the protocol, otherwise the export fails."
  - id: "ats073-030-q05"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Know the default service name"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A program has no `OTEL_SERVICE_NAME` and no `service.name` resource attribute. What `service.name` does the SDK report?"
    options:
      - id: "a"
        text: "`unknown_service`, which can have the process name added."
        explanation: "Correct. The specification defines this fallback, and it makes the telemetry hard to find."
      - id: "b"
        text: "The name of the Kubernetes Deployment."
        explanation: "The SDK does not read the Deployment name unless it is configured."
      - id: "c"
        text: "An empty string."
        explanation: "The SDK uses the fallback name."
      - id: "d"
        text: "The name of the Collector."
        explanation: "The producer is not named after the receiver."
    correct_option: "a"
    explanation: "The specification defines this fallback, and it makes the telemetry hard to find."
  - id: "ats073-030-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Know the effect of switches and samplers"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A pod sends no spans. Its environment has `OTEL_TRACES_SAMPLER=always_off`. What does this sampler do?"
    options:
      - id: "a"
        text: "It records every trace."
        explanation: "That is `always_on`."
      - id: "b"
        text: "It records no trace, so no span is exported."
        explanation: "Correct. The sampler decides at the start of a trace, and `always_off` drops all of them."
      - id: "c"
        text: "It records only traces that have an error."
        explanation: "The sampler does not look at errors."
      - id: "d"
        text: "It disables metrics only."
        explanation: "The sampler setting applies to traces."
    correct_option: "b"
    explanation: "The sampler decides at the start of a trace, and `always_off` drops all of them."
  - id: "ats073-030-q07"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish manual from automatic instrumentation"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "Which observation usually needs manual instrumentation?"
    options:
      - id: "a"
        text: "A server request handled by a supported web framework."
        explanation: "An instrumentation library for the framework covers it."
      - id: "b"
        text: "An outgoing call made with a supported HTTP client."
        explanation: "An instrumentation library for the client covers it."
      - id: "c"
        text: "A business step, such as `process-order`, that no framework hook describes."
        explanation: "Correct. Only the application knows the meaning of its own steps."
      - id: "d"
        text: "The environment variables of the SDK."
        explanation: "Environment variables configure the SDK. They are not an observation."
    correct_option: "c"
    explanation: "Only the application knows the meaning of its own steps."
  - id: "ats073-030-q08"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose bounded attributes for measurements"
    source_readings:
      - "sections/section-030/module-01/course-03-designing-useful-measurements.md"
    prompt: "A counter `orders.processed` needs a dimension. Which attribute is the best choice?"
    options:
      - id: "a"
        text: "`order.id`, a unique identifier."
        explanation: "A unique value per order creates an unbounded number of series."
      - id: "b"
        text: "`customer.email`."
        explanation: "It is unbounded and also personal data."
      - id: "c"
        text: "`order.status` with a small fixed set of values."
        explanation: "Correct. A bounded attribute gives a useful split and a limited number of series."
      - id: "d"
        text: "`request.timestamp`."
        explanation: "A timestamp has an unlimited number of values."
    correct_option: "c"
    explanation: "A bounded attribute gives a useful split and a limited number of series."
  - id: "ats073-030-q09"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Avoid duplicated observations"
    source_readings:
      - "sections/section-030/module-01/course-03-designing-useful-measurements.md"
    prompt: "A team adds manual spans around every HTTP call that an automatic instrumentation library already traces. What is the result?"
    options:
      - id: "a"
        text: "Each call is observed twice, which duplicates data and can mislead counts."
        explanation: "Correct. Overlapping instrumentation needs one agreed boundary for each operation."
      - id: "b"
        text: "The SDK removes the duplicates by itself."
        explanation: "The SDK does not know that two spans describe the same call."
      - id: "c"
        text: "The Collector merges the spans into one."
        explanation: "The Collector does not merge spans."
      - id: "d"
        text: "The automatic library stops working."
        explanation: "It keeps working and creates its own spans."
    correct_option: "a"
    explanation: "Overlapping instrumentation needs one agreed boundary for each operation."
  - id: "ats073-030-q10"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "State what the API does without an SDK"
    source_readings:
      - "sections/section-030/module-02/course-01-tracers-meters-and-instrumentation-scope.md"
    prompt: "A program calls the OpenTelemetry API but no SDK is installed. What happens?"
    options:
      - id: "a"
        text: "The program stops with an error."
        explanation: "The API is designed to be safe without an SDK."
      - id: "b"
        text: "The calls do nothing, and no error says so."
        explanation: "Correct. Without an SDK the API is a no-op."
      - id: "c"
        text: "Spans are written to a local file."
        explanation: "Only an SDK with an exporter can write data."
      - id: "d"
        text: "Spans are sent to the default Collector."
        explanation: "An exporter must be configured by an SDK."
    correct_option: "b"
    explanation: "Without an SDK the API is a no-op and produces nothing."
  - id: "ats073-030-q11"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Describe the instrumentation scope"
    source_readings:
      - "sections/section-030/module-02/course-01-tracers-meters-and-instrumentation-scope.md"
    prompt: "The call `get_tracer(\"starfleet.orders\", \"1.4.0\")` sets which identity?"
    options:
      - id: "a"
        text: "The service name of the program."
        explanation: "The service name is a resource attribute."
      - id: "b"
        text: "The instrumentation scope, which names the code that produced the data."
        explanation: "Correct. The scope is the name and the version of the instrumenting code."
      - id: "c"
        text: "The sampling rate."
        explanation: "The sampler sets that."
      - id: "d"
        text: "The Collector pipeline."
        explanation: "The pipeline is Collector configuration."
    correct_option: "a"
    explanation: "The scope and the service are different identities."
  - id: "ats073-030-q12"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Explain the lifetime of a span"
    source_readings:
      - "sections/section-030/module-02/course-02-creating-spans-attributes-and-kind.md"
    prompt: "A program starts a span with `start_span` and never calls `end`. What happens to the span?"
    options:
      - id: "a"
        text: "It is exported when the program exits normally."
        explanation: "An unfinished span is not exported at exit."
      - id: "b"
        text: "It is exported with the status error."
        explanation: "The status is not set by a missing end."
      - id: "c"
        text: "It is exported at once with a zero duration."
        explanation: "A span has no duration until it ends."
      - id: "d"
        text: "It is never exported."
        explanation: "Correct. A span that never ends is never exported."
    correct_option: "d"
    explanation: "A span that never ends is never exported."
  - id: "ats073-030-q13"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose the attributes for a sampler"
    source_readings:
      - "sections/section-030/module-02/course-02-creating-spans-attributes-and-kind.md"
    prompt: "A sampler must decide on the attribute `order.items`. When must the code set it?"
    options:
      - id: "a"
        text: "In the call that starts the span."
        explanation: "Correct. The sampler runs when the span starts, so only attributes passed at start are visible to it."
      - id: "b"
        text: "After the span ends."
        explanation: "The decision has been made by then."
      - id: "c"
        text: "In the Collector."
        explanation: "The head sampler in the SDK does not see Collector changes."
      - id: "d"
        text: "In the resource."
        explanation: "A resource attribute does not change per operation."
    correct_option: "a"
    explanation: "Attributes that a sampler needs go into the call that starts the span."
  - id: "ats073-030-q14"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Record a caught exception"
    source_readings:
      - "sections/section-030/module-02/course-03-events-exceptions-and-span-status.md"
    prompt: "Code catches a `ValueError` inside the span block and carries on. The exported span has the status unset and no event. What is missing?"
    options:
      - id: "a"
        text: "A second tracer."
        explanation: "A second tracer would not change this."
      - id: "b"
        text: "A longer span name."
        explanation: "The name does not record failure."
      - id: "c"
        text: "A call to `record_exception` and a call to `set_status` with the error status."
        explanation: "Correct. An exception caught inside the block is hidden from the context manager, so the code must record it and set the status."
      - id: "d"
        text: "A resource attribute."
        explanation: "It describes the producer."
    correct_option: "c"
    explanation: "An exception caught inside the block hides from the context manager."
  - id: "ats073-030-q15"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Pick the instrument for a duration"
    source_readings:
      - "sections/section-030/module-02/course-04-metric-instruments-in-code.md"
    prompt: "Which instrument records the time that each order takes, so that the share below a threshold can be read later?"
    options:
      - id: "a"
        text: "Counter."
        explanation: "A counter only adds up and has no distribution."
      - id: "b"
        text: "Histogram."
        explanation: "Correct. A histogram records a distribution, and durations are recorded in seconds."
      - id: "c"
        text: "UpDownCounter."
        explanation: "It follows a value that goes up and down."
      - id: "d"
        text: "Log record."
        explanation: "A log record is not a metric instrument."
    correct_option: "b"
    explanation: "A Histogram records a distribution and durations use seconds."
  - id: "ats073-030-q16"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Explain Operator injection"
    source_readings:
      - "sections/section-030/module-03/course-01-zero-code-instrumentation.md"
    prompt: "How does the OpenTelemetry Operator add an agent to an application pod in Kubernetes?"
    options:
      - id: "a"
        text: "A pod annotation asks for injection, and the Operator changes the pod at creation with an init container and environment variables."
        explanation: "Correct. The Instrumentation resource holds the settings and the annotation selects the language."
      - id: "b"
        text: "It rebuilds the container image of the application."
        explanation: "The image stays unchanged."
      - id: "c"
        text: "It edits the source code in the cluster."
        explanation: "The Operator does not touch the source."
      - id: "d"
        text: "It runs the agent on the node only and never in the pod."
        explanation: "The agent runs inside the application process."
    correct_option: "a"
    explanation: "The Operator injects the agent through a webhook when the pod is created."
  - id: "ats073-030-q17"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Diagnose broken propagation"
    source_readings:
      - "sections/section-030/module-03/course-02-context-propagation-and-propagators.md"
    prompt: "A client calls a server and both send spans to the same Collector. The server span has an empty parent ID and a different trace ID from the client span. What is the most likely cause?"
    options:
      - id: "a"
        text: "The Collector drops the parent spans."
        explanation: "The Collector would not change trace IDs."
      - id: "b"
        text: "The server does not extract the trace context, for example because its propagator list is none."
        explanation: "Correct. The server then starts a new trace for the request."
      - id: "c"
        text: "The sampler ratio is too high."
        explanation: "Sampling decides what is recorded, it does not create new trace IDs."
      - id: "d"
        text: "The exporter uses HTTP."
        explanation: "The protocol does not affect the trace ID."
    correct_option: "b"
    explanation: "A server span without a parent where a caller exists points to missing extraction."
  - id: "ats073-030-q18"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Read the traceparent header"
    source_readings:
      - "sections/section-030/module-03/course-02-context-propagation-and-propagators.md"
    prompt: "Which fields does the W3C `traceparent` header contain?"
    options:
      - id: "a"
        text: "A service name, a host name and a port."
        explanation: "These are not in the header."
      - id: "b"
        text: "A baggage list and a sampler name."
        explanation: "Baggage has its own header."
      - id: "c"
        text: "A version, a trace ID, a parent span ID and flags."
        explanation: "Correct. The four fields are separated by dashes."
      - id: "d"
        text: "A start time and a duration."
        explanation: "Timing is not carried in the header."
    correct_option: "c"
    explanation: "traceparent has four fields: version, trace ID, parent span ID and flags."
  - id: "ats073-030-q19"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Know what baggage does"
    source_readings:
      - "sections/section-030/module-03/course-03-baggage.md"
    prompt: "A client sets the baggage key `customer.tier`. The server code does nothing with baggage. Does the key appear as an attribute on the server span?"
    options:
      - id: "a"
        text: "Yes, every baggage key becomes a span attribute."
        explanation: "This does not happen by itself."
      - id: "b"
        text: "Yes, but only for the root span."
        explanation: "The copy does not happen for any span by itself."
      - id: "c"
        text: "No, because the baggage header is removed by the Collector."
        explanation: "The header is not handled by the Collector."
      - id: "d"
        text: "No. Baggage is not copied to span attributes unless code or a processor does it."
        explanation: "Correct. Baggage travels in the context and is visible only to code that reads it."
    correct_option: "d"
    explanation: "Baggage needs an explicit copy to become telemetry."
  - id: "ats073-030-q20"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Know the risk of baggage"
    source_readings:
      - "sections/section-030/module-03/course-03-baggage.md"
    prompt: "Which kind of value must not be placed in baggage?"
    options:
      - id: "a"
        text: "A secret or personal data."
        explanation: "Correct. Baggage is sent in a header to every service the request reaches."
      - id: "b"
        text: "A customer tier such as gold."
        explanation: "A short non-sensitive label is a typical use."
      - id: "c"
        text: "A region name."
        explanation: "A region is a normal use."
      - id: "d"
        text: "A tenant name that is not secret."
        explanation: "A tenant label is a typical use."
    correct_option: "a"
    explanation: "Baggage goes to every service in the call chain, so it must not carry secrets."
  - id: "ats073-030-q21"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Use a parent-based sampler"
    source_readings:
      - "sections/section-030/module-03/course-04-samplers-and-parent-based-decisions.md"
    prompt: "A root service uses `parentbased_traceidratio` with the ratio 0.1. A downstream service with the same sampler receives a request whose traceparent has the sampled flag set. What does the downstream service do?"
    options:
      - id: "a"
        text: "It follows the flag and records its spans."
        explanation: "Correct. A parent-based sampler uses the decision of the parent."
      - id: "b"
        text: "It applies the ratio 0.1 again."
        explanation: "The ratio is used only when there is no parent."
      - id: "c"
        text: "It drops its spans."
        explanation: "The flag says the trace is sampled."
      - id: "d"
        text: "It records only error spans."
        explanation: "That is tail sampling, which a SDK sampler does not do."
    correct_option: "a"
    explanation: "The flag in the context carries one decision to all services."
