# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats073-030"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: "section"
  id: "section-030"
  title: "Instrumentation"
questions:
  - id: "ats073-030-q01"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Explain why library code depends on the API only"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "A shared library records spans. Why should it depend on the OpenTelemetry API and not on a specific SDK?"
    options:
      - id: "a"
        text: "The API is faster than the SDK."
        explanation: "Speed is not the reason."
      - id: "b"
        text: "The API exports data over the network, and the SDK does not."
        explanation: "The SDK, not the API, exports data."
      - id: "c"
        text: "The application owner chooses the SDK and the exporter, and the library works with any of them."
        explanation: "Correct. The API defines the calls. The application decides what implements them, so a library does not force a choice."
      - id: "d"
        text: "The SDK cannot record spans."
        explanation: "The SDK does record spans."
    correct_option: "c"
    explanation: "The API defines the calls. The application decides what implements them, so a library does not force a choice."
  - id: "ats073-030-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Describe what happens with the API and no SDK"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "A program calls the API to start a span, but no SDK is installed or configured. What happens?"
    options:
      - id: "a"
        text: "The calls do nothing: the API returns no-op objects and no telemetry is recorded."
        explanation: "Correct. Without an SDK, the API calls are no-ops, and that keeps libraries safe to use everywhere."
      - id: "b"
        text: "The program fails at start."
        explanation: "The API is designed so that the program keeps running."
      - id: "c"
        text: "The spans are written to the standard output."
        explanation: "Printing is a job of an exporter in an SDK."
      - id: "d"
        text: "The spans are sent to port 4317 by default."
        explanation: "The API has no exporter and sends nothing."
    correct_option: "a"
    explanation: "Without an SDK, the API calls are no-ops, and that keeps libraries safe to use everywhere."
  - id: "ats073-030-q03"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Name the role of an exporter"
    source_readings:
      - "sections/section-030/module-01/course-01-api-sdk-and-exporter-who-does-what.md"
    prompt: "Which component sends finished spans from the program to the Collector?"
    options:
      - id: "a"
        text: "The tracer provider of the API."
        explanation: "The API only defines the interface."
      - id: "b"
        text: "A span exporter, such as the OTLP exporter, in the SDK pipeline."
        explanation: "Correct. The SDK passes finished spans to a processor and then to an exporter that sends them over a protocol."
      - id: "c"
        text: "The `resource` processor of the Collector."
        explanation: "That component runs in the Collector, after the data has been sent."
      - id: "d"
        text: "The Kubernetes Service."
        explanation: "A Service routes network traffic and does not export telemetry."
    correct_option: "b"
    explanation: "The SDK passes finished spans to a processor and then to an exporter that sends them over a protocol."
  - id: "ats073-030-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Match the exporter protocol with the endpoint port"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A program sets `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf` and `OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317`. The Collector listens on 4317 for gRPC and on 4318 for HTTP. What is wrong?"
    options:
      - id: "a"
        text: "The scheme must be `https`."
        explanation: "The scheme is not the problem."
      - id: "b"
        text: "The protocol must be `grpc` when the port is above 4000."
        explanation: "The protocol does not depend on the port number this way."
      - id: "c"
        text: "Nothing, because both ports accept both protocols."
        explanation: "Each port serves one protocol."
      - id: "d"
        text: "The protocol `http/protobuf` needs the HTTP port 4318, not the gRPC port 4317."
        explanation: "Correct. The endpoint must match the protocol, otherwise the export fails."
    correct_option: "d"
    explanation: "The endpoint must match the protocol, otherwise the export fails."
  - id: "ats073-030-q05"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Know the default service name"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A program has no `OTEL_SERVICE_NAME` and no `service.name` resource attribute. What `service.name` does the SDK report?"
    options:
      - id: "a"
        text: "`unknown_service`, which can have the process name added."
        explanation: "Correct. The specification defines this fallback, and it makes the telemetry hard to find."
      - id: "b"
        text: "The name of the Kubernetes Deployment."
        explanation: "The SDK does not read the Deployment name unless it is configured."
      - id: "c"
        text: "An empty string."
        explanation: "The SDK uses the fallback name."
      - id: "d"
        text: "The name of the Collector."
        explanation: "The producer is not named after the receiver."
    correct_option: "a"
    explanation: "The specification defines this fallback, and it makes the telemetry hard to find."
  - id: "ats073-030-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Know the effect of switches and samplers"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "A pod sends no spans. Its environment has `OTEL_TRACES_SAMPLER=always_off`. What does this sampler do?"
    options:
      - id: "a"
        text: "It records every trace."
        explanation: "That is `always_on`."
      - id: "b"
        text: "It records no trace, so no span is exported."
        explanation: "Correct. The sampler decides at the start of a trace, and `always_off` drops all of them."
      - id: "c"
        text: "It records only traces that have an error."
        explanation: "The sampler does not look at errors."
      - id: "d"
        text: "It disables metrics only."
        explanation: "The sampler setting applies to traces."
    correct_option: "b"
    explanation: "The sampler decides at the start of a trace, and `always_off` drops all of them."
  - id: "ats073-030-q07"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish manual from automatic instrumentation"
    source_readings:
      - "sections/section-030/module-01/course-02-automatic-instrumentation-and-environment-variables.md"
    prompt: "Which observation usually needs manual instrumentation?"
    options:
      - id: "a"
        text: "A server request handled by a supported web framework."
        explanation: "An instrumentation library for the framework covers it."
      - id: "b"
        text: "An outgoing call made with a supported HTTP client."
        explanation: "An instrumentation library for the client covers it."
      - id: "c"
        text: "A business step, such as `process-order`, that no framework hook describes."
        explanation: "Correct. Only the application knows the meaning of its own steps."
      - id: "d"
        text: "The environment variables of the SDK."
        explanation: "Environment variables configure the SDK. They are not an observation."
    correct_option: "c"
    explanation: "Only the application knows the meaning of its own steps."
  - id: "ats073-030-q08"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose bounded attributes for measurements"
    source_readings:
      - "sections/section-030/module-01/course-03-designing-useful-measurements.md"
    prompt: "A counter `orders.processed` needs a dimension. Which attribute is the best choice?"
    options:
      - id: "a"
        text: "`order.id`, a unique identifier."
        explanation: "A unique value per order creates an unbounded number of series."
      - id: "b"
        text: "`customer.email`."
        explanation: "It is unbounded and also personal data."
      - id: "c"
        text: "`order.status` with a small fixed set of values."
        explanation: "Correct. A bounded attribute gives a useful split and a limited number of series."
      - id: "d"
        text: "`request.timestamp`."
        explanation: "A timestamp has an unlimited number of values."
    correct_option: "c"
    explanation: "A bounded attribute gives a useful split and a limited number of series."
  - id: "ats073-030-q09"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Avoid duplicated observations"
    source_readings:
      - "sections/section-030/module-01/course-03-designing-useful-measurements.md"
    prompt: "A team adds manual spans around every HTTP call that an automatic instrumentation library already traces. What is the result?"
    options:
      - id: "a"
        text: "Each call is observed twice, which duplicates data and can mislead counts."
        explanation: "Correct. Overlapping instrumentation needs one agreed boundary for each operation."
      - id: "b"
        text: "The SDK removes the duplicates by itself."
        explanation: "The SDK does not know that two spans describe the same call."
      - id: "c"
        text: "The Collector merges the spans into one."
        explanation: "The Collector does not merge spans."
      - id: "d"
        text: "The automatic library stops working."
        explanation: "It keeps working and creates its own spans."
    correct_option: "a"
    explanation: "Overlapping instrumentation needs one agreed boundary for each operation."
