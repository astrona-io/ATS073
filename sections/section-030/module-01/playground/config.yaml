# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# API Calls And Automatic Instrumentation (PLAYGROUND). A Python program that calls the OpenTelemetry API, started by the opentelemetry-instrument launcher. No task, no grading, no `astrona submit`. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-073-playground-030-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - python:3.13-slim

bootstrap:
  manifests:
    - name: observability
      type: file
      source: manifests/observability.yaml
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/otel-collector
      namespace: observability
    - resource: deploy/shuttle-orders
      namespace: starfleet

teardown:
  keepCluster: false
