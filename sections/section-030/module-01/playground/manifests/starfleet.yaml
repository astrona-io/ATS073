apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-app
  namespace: starfleet
data:
  app.py: |
    import os
    import random
    import time

    from opentelemetry import metrics, trace

    tracer = trace.get_tracer("starfleet.orders")
    meter = metrics.get_meter("starfleet.orders")
    processed = meter.create_counter("orders.processed", unit="{order}", description="Orders processed")
    work_name = os.environ.get("WORK_NAME", "process-order")

    while True:
        with tracer.start_as_current_span(work_name) as span:
            span.set_attribute("order.items", random.randint(1, 5))
            with tracer.start_as_current_span("reserve-stock"):
                time.sleep(0.05)
            processed.add(1, {"order.outcome": "accepted"})
        time.sleep(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle-orders
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle-orders
  template:
    metadata:
      labels:
        app: shuttle-orders
    spec:
      containers:
        - name: app
          image: python:3.13-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir -q opentelemetry-distro==0.66b2 opentelemetry-exporter-otlp==1.45.2 && exec opentelemetry-instrument python /app/app.py
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4318"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_SERVICE_NAME
              value: "shuttle-orders"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=production,service.version=1.4.0"
            - name: WORK_NAME
              value: "process-order"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: orders-app
