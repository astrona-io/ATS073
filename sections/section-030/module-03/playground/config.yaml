# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Zero-Code Instrumentation, Propagators And Baggage (PLAYGROUND). A Collector and two Python services under zero-code instrumentation, a client and a billing server, that produce connected traces. No task, no grading, no `astrona submit`. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-073-playground-030-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - python:3.13-slim

bootstrap:
  manifests:
    - name: observability
      type: file
      source: manifests/observability.yaml
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/otel-collector
      namespace: observability
    - resource: deploy/shuttle-billing
      namespace: starfleet
    - resource: deploy/shuttle-client
      namespace: starfleet

teardown:
  keepCluster: false
