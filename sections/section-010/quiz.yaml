# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats073-010"
course_id: "ATS073"
exam_code: "OTCA"
status: "draft"
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: "section"
  id: "section-010"
  title: "Telemetry Data"
questions:
  - id: "ats073-010-q01"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Name the question each signal answers best"
    source_readings:
      - "sections/section-010/module-01/course-01-metrics-traces-and-logs.md"
    prompt: "An engineer must find which step of one slow request took the most time. Which signal answers this question most directly?"
    options:
      - id: "a"
        text: "A counter metric of requests per minute."
        explanation: "A counter shows how many requests arrived, not how long the steps of one request took."
      - id: "b"
        text: "A trace made of spans, each with a start time and a duration."
        explanation: "Correct. A span records one timed operation, and the spans of one trace show which step took the most time."
      - id: "c"
        text: "A log record without a trace identifier."
        explanation: "A log record can describe an event, but without a trace identifier it cannot be tied to one request."
      - id: "d"
        text: "The resource attribute `service.name`."
        explanation: "A resource attribute names the producer. It carries no timing."
    correct_option: "b"
    explanation: "A span records one timed operation, and the spans of one trace show which step took the most time."
  - id: "ats073-010-q02"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Choose the signal for a question about totals over time"
    source_readings:
      - "sections/section-010/module-01/course-01-metrics-traces-and-logs.md"
    prompt: "A team wants a chart of how many orders per minute the service `bridge` processed over the last week, at a low storage cost. Which signal fits best?"
    options:
      - id: "a"
        text: "Spans, because every order is a request."
        explanation: "Spans can be counted, but storing every span for a week costs far more than an aggregate."
      - id: "b"
        text: "Log records, because each order writes a line."
        explanation: "Log records can be counted, but they are expensive to store and to query for a simple total."
      - id: "c"
        text: "A metric: a monotonic sum that the program increments on each order."
        explanation: "Correct. A metric aggregates in the program, so a week of data is a small number of data points."
      - id: "d"
        text: "A resource attribute with the order count."
        explanation: "A resource attribute describes the producer and does not change on each order."
    correct_option: "c"
    explanation: "A metric aggregates in the program, so a week of data is a small number of data points."
  - id: "ats073-010-q03"
    type: "single_choice"
    difficulty: "beginner"
    learning_objective: "Explain how a log record links to a span"
    source_readings:
      - "sections/section-010/module-01/course-02-resource-identity-scope-and-correlation.md"
    prompt: "A log record must be linked to the span that was active when the program wrote it. Which fields of the log record carry the link?"
    options:
      - id: "a"
        text: "`severity_text` and `body`."
        explanation: "These fields hold the level and the message, not a link."
      - id: "b"
        text: "`service.name` and `service.version`."
        explanation: "These resource attributes identify the producer and apply to all its telemetry."
      - id: "c"
        text: "`observed_time_unix_nano` and `time_unix_nano`."
        explanation: "These fields hold timestamps. A timestamp alone does not identify a span."
      - id: "d"
        text: "`trace_id` and `span_id`."
        explanation: "Correct. A log record that carries the trace identifier and the span identifier can be joined to the span."
    correct_option: "d"
    explanation: "A log record that carries the trace identifier and the span identifier can be joined to the span."
  - id: "ats073-010-q04"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Distinguish resource identity from instrumentation scope"
    source_readings:
      - "sections/section-010/module-01/course-02-resource-identity-scope-and-correlation.md"
    prompt: "Which statement describes the instrumentation scope of a span?"
    options:
      - id: "a"
        text: "It names and versions the library or the code that created the telemetry."
        explanation: "Correct. The scope identifies the instrumentation, for example the name and the version of an HTTP client library, and it is separate from the resource."
      - id: "b"
        text: "It names the host and the cluster where the process runs."
        explanation: "That is resource information."
      - id: "c"
        text: "It is the `service.name` of the process."
        explanation: "That is a resource attribute and it applies to the whole process."
      - id: "d"
        text: "It is the sampling decision of the trace."
        explanation: "The sampling decision is carried in the trace flags, not in the scope."
    correct_option: "a"
    explanation: "The scope identifies the instrumentation, for example the name and the version of an HTTP client library, and it is separate from the resource."
  - id: "ats073-010-q05"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Explain why resource attributes are set once per producer"
    source_readings:
      - "sections/section-010/module-01/course-02-resource-identity-scope-and-correlation.md"
    prompt: "Why does OpenTelemetry attach `service.name` as a resource attribute and not as an attribute on every span?"
    options:
      - id: "a"
        text: "A span cannot carry attributes."
        explanation: "A span can carry attributes."
      - id: "b"
        text: "The resource describes the producing entity once, and every item from that entity shares it."
        explanation: "Correct. The resource is the same for all telemetry of a process, so it is attached once to each export batch and not repeated per item."
      - id: "c"
        text: "A resource attribute is the only attribute that survives sampling."
        explanation: "Sampling decides whole traces. It does not depend on the attribute kind."
      - id: "d"
        text: "The backend rejects span attributes that start with `service`."
        explanation: "No such rule exists."
    correct_option: "b"
    explanation: "The resource is the same for all telemetry of a process, so it is attached once to each export batch and not repeated per item."
  - id: "ats073-010-q06"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Read a Collector configuration with a missing pipeline"
    source_readings:
      - "sections/section-010/module-01/course-03-collector-pipelines-sampling-and-evidence-limits.md"
    prompt: "A Collector configuration has `service.pipelines.traces` only. The program sends traces, metrics and logs to the `otlp` receiver. What happens to the metrics and the logs?"
    options:
      - id: "a"
        text: "They are processed by the traces pipeline."
        explanation: "A pipeline handles one signal type only."
      - id: "b"
        text: "They are stored in memory until a metrics pipeline is added."
        explanation: "The Collector does not hold data for a pipeline that does not exist."
      - id: "c"
        text: "They are converted into spans by the `debug` exporter."
        explanation: "An exporter does not change the signal type."
      - id: "d"
        text: "No pipeline processes them, so they never reach an exporter."
        explanation: "Correct. A signal needs its own pipeline with receivers and exporters, and the output of the `debug` exporter shows only the signals that have one."
    correct_option: "d"
    explanation: "A signal needs its own pipeline with receivers and exporters, and the output of the `debug` exporter shows only the signals that have one."
  - id: "ats073-010-q07"
    type: "single_choice"
    difficulty: "intermediate"
    learning_objective: "Place a sampling processor in the right pipelines"
    source_readings:
      - "sections/section-010/module-01/course-03-collector-pipelines-sampling-and-evidence-limits.md"
    prompt: "The team keeps 25 percent of traces with the `probabilistic_sampler` processor. Where must the processor appear?"
    options:
      - id: "a"
        text: "In the `traces` pipeline only."
        explanation: "Correct. The sampler works on trace identifiers, so it belongs to the `traces` pipeline and it does not change metrics or logs."
      - id: "b"
        text: "In all three pipelines, so that the three signals stay in proportion."
        explanation: "The processor is designed for traces. Metrics and logs would not be sampled the same way."
      - id: "c"
        text: "Only in the exporter section."
        explanation: "A processor is listed in a pipeline, not as an exporter setting."
      - id: "d"
        text: "Only in the receiver section."
        explanation: "A receiver does not list processors."
    correct_option: "a"
    explanation: "The sampler works on trace identifiers, so it belongs to the `traces` pipeline and it does not change metrics or logs."
  - id: "ats073-010-q08"
    type: "single_choice"
    difficulty: "advanced"
    learning_objective: "Reason about evidence limits"
    source_readings:
      - "sections/section-010/module-01/course-03-collector-pipelines-sampling-and-evidence-limits.md"
    prompt: "No span for the operation `charge-card` appears in the backend. Which conclusion is justified?"
    options:
      - id: "a"
        text: "The operation never ran."
        explanation: "Sampling, a failed export or a missing instrumentation can each hide an operation that ran."
      - id: "b"
        text: "The operation ran and failed."
        explanation: "Nothing in the data says that."
      - id: "c"
        text: "The data cannot prove that the operation did not run, because sampling or a collection gap can hide it."
        explanation: "Correct. Absence of a span is weak evidence. The observation path has its own limits."
      - id: "d"
        text: "The backend deleted the span because its name is too long."
        explanation: "No such rule exists."
    correct_option: "c"
    explanation: "Absence of a span is weak evidence. The observation path has its own limits."
