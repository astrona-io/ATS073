apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle-load
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle-load
  template:
    metadata:
      labels:
        app: shuttle-load
    spec:
      containers:
        - name: traces-ok
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'traces'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '5'
            - '--service'
            - 'shuttle'
            - '--child-spans'
            - '2'
            - '--status-code'
            - 'Ok'
        - name: traces-error
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'traces'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '1'
            - '--service'
            - 'shuttle'
            - '--status-code'
            - 'Error'
