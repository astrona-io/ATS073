apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle-logs
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle-logs
  template:
    metadata:
      labels:
        app: shuttle-logs
    spec:
      containers:
        - name: logs-info
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'logs'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '5'
            - '--service'
            - 'shuttle'
            - '--severity-text'
            - 'Info'
            - '--severity-number'
            - '9'
            - '--body'
            - 'order accepted'
        - name: logs-debug
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - 'logs'
            - '--otlp-insecure'
            - '--otlp-endpoint'
            - 'otel-collector.observability:4317'
            - '--duration'
            - 'inf'
            - '--rate'
            - '5'
            - '--service'
            - 'shuttle'
            - '--severity-text'
            - 'Debug'
            - '--severity-number'
            - '5'
            - '--body'
            - 'stock lookup'
