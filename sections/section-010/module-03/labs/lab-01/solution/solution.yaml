apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      filter/drop-debug:
        error_mode: ignore
        logs:
          log_record:
            - severity_number < SEVERITY_NUMBER_INFO
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [filter/drop-debug]
          exporters: [debug]
