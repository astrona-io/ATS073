# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Telemetry Data Capstone (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-073-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0

bootstrap:
  init:
    - name: seed-cluster
      description: "Create the Collector with traces and logs pipelines only and the load generators"
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the collector and the generators have produced new output
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: collector-available
      description: "The Collector Deployment is available with its original image"
      type: file
      source: validation/validate-collector-available.sh
      hint: "Change the ConfigMap and restart. Do not replace the Deployment."
    - name: pipelines-complete
      description: "Traces, metrics and logs pipelines exist and use the resource processor"
      type: file
      source: validation/validate-pipelines-complete.sh
      hint: "The metrics pipeline is missing. Add it, and list resource in all three pipelines in flow style."
    - name: sampler-on-traces-only
      description: "probabilistic_sampler at 25 percent runs in the traces pipeline and in no other pipeline"
      type: file
      source: validation/validate-sampler-on-traces-only.sh
      hint: "Define probabilistic_sampler with sampling_percentage: 25 and list it only in traces."
    - name: signals-flowing
      description: "Spans, metrics and log records reach the debug exporter of the running pod"
      type: file
      source: validation/validate-signals-flowing.sh
      hint: "Restart the Collector, wait 30 seconds and submit again."
    - name: resource-identity-present
      description: "Every signal carries deployment.environment.name=production and service.namespace=starfleet"
      type: file
      source: validation/validate-resource-identity-present.sh
      hint: "Use the resource processor with action upsert."
    - name: evidence-recorded
      description: "The ConfigMap telemetry-evidence records the signals, the missing signal, the sampled signal and the percentage"
      type: file
      source: validation/validate-evidence-recorded.sh
      hint: "Create the ConfigMap in starfleet with the keys signals, missing-signal, sampled-signal and sampling-percentage."
    - name: generators-unchanged
      description: "Both load generators are unchanged"
      type: file
      source: validation/validate-generators-unchanged.sh
      hint: "Do not edit bridge-load or probe-load."

teardown:
  keepCluster: false
