apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    processors:
      resource:
        attributes:
          - key: deployment.environment.name
            value: production
            action: upsert
          - key: service.namespace
            value: starfleet
            action: upsert
      probabilistic_sampler:
        sampling_percentage: 25
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [probabilistic_sampler, resource]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [resource]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [resource]
          exporters: [debug]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-evidence
  namespace: starfleet
data:
  signals: "traces,metrics,logs"
  missing-signal: "metrics"
  sampled-signal: "traces"
  sampling-percentage: "25"
